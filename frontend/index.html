<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <title>SikaTrack</title>
    <script>
      // Runs before Svelte mounts, so there's no flash of the wrong theme
      // or a flash of real numbers with privacy mode on. Kept in sync with
      // src/lib/theme.js and src/lib/privacy.js.
      (function () {
        var stored = localStorage.getItem("sikatrack-theme") || "system";
        var dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("privacy-mode", localStorage.getItem("sikatrack-privacy") === "1");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
