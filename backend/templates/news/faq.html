{% extends "base.html" %}
{% block title %}FAQ — SikaTrack{% endblock %}
{% block content %}
<h1 class="text-xl font-bold mb-6">Frequently asked questions</h1>
<div class="bg-white border border-gray-200 rounded-xl p-5 space-y-5 max-w-2xl">
    {% for q, a in faqs %}
    <div>
        <p class="text-sm font-medium">{{ q }}</p>
        <p class="text-sm text-gray-500 mt-1">{{ a }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
