{% if instrument.logo %}
<img src="{{ instrument.logo.url }}" alt="{{ instrument.ticker }}" class="{{ size_classes }} rounded-full object-cover shrink-0 bg-white border border-gray-200">
{% else %}
<div class="{{ size_classes }} rounded-full flex items-center justify-center font-bold text-white shrink-0" style="background-color: {{ bg_color }}">{{ initials }}</div>
{% endif %}
