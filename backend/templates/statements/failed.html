{% extends "base.html" %}
{% block title %}Couldn't read statement — SikaTrack{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12 text-center">
    <div class="text-4xl mb-4">⚠️</div>
    <p class="font-medium mb-2">We couldn't process this file</p>
    <p class="text-sm text-gray-500 mb-6">{{ statement.parse_error }}</p>
    <a href="{% url 'portfolio:transaction_add' %}" class="inline-block bg-emerald-600 text-white rounded-lg px-4 py-2 text-sm font-medium">
        Add these transactions manually instead
    </a>
    <div class="mt-3">
        <a href="{% url 'statements:upload' %}" class="text-sm text-gray-500">Try uploading a different file</a>
    </div>
</div>
{% endblock %}
